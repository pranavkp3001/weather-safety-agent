version: "1.0"
sops:
  # BASELINE / NORMAL POLICY GROUP
  - id: "SOP-BASE-EX-001"
    name: "General Outdoor Exercise Baseline"
    category: "General Outdoor Exercise"
    applies_to:
      - "cycling"
      - "running"
      - "walking"
      - "jogging"
      - "hiking"
    severity: "low"
    priority: 30
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 18
          unit: "celsius"
        - field: "temperature"
          operator: "<="
          value: 35
          unit: "celsius"
        - field: "weather_condition"
          operator: "in"
          value: ["clear", "cloudy"]
        - field: "precipitation"
          operator: "<="
          value: 2
          unit: "mm"
        - field: "wind_speed"
          operator: "<="
          value: 25
          unit: "kmh"
    guidance: |
      Current conditions fall within WeatherBuddy's normal outdoor-exercise guidance. This is a low-risk baseline range for active outdoor exercise, so the system is not issuing a restriction for this session.
      1. Maintain a steady pace and stay well hydrated
      2. Favor the cooler parts of the day when the session is longer
      3. Continue to monitor conditions if the plan changes or the weather deteriorates
    source: "WeatherBuddy baseline policy"

  - id: "SOP-BASE-LEISURE-001"
    name: "General Outdoor Leisure Baseline"
    category: "Leisure"
    applies_to:
      - "park_visit"
      - "picnic"
      - "outdoor_photography"
    severity: "low"
    priority: 28
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 18
          unit: "celsius"
        - field: "temperature"
          operator: "<="
          value: 30
          unit: "celsius"
        - field: "weather_condition"
          operator: "in"
          value: ["clear", "cloudy"]
        - field: "precipitation"
          operator: "<="
          value: 2
          unit: "mm"
    guidance: |
      Current conditions fall within WeatherBuddy's normal outdoor-leisure guidance. This range is considered routine for a low-risk park, picnic, or outdoor leisure outing.
      1. Keep a comfortable pace and stay hydrated
      2. Use shade or a cooler window if the outing runs long
      3. Continue monitoring the forecast if conditions begin to worsen
    source: "WeatherBuddy baseline policy"

  # CYCLING CATEGORY (3 SOPs)
  - id: "SOP-CYC-001"
    name: "Cycling in High Heat"
    category: "Cycling"
    applies_to:
      - "cycling"
      - "biking"
    severity: "high"
    priority: 100
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 35
          unit: "celsius"
        - field: "activity"
          operator: "=="
          value: "cycling"
    guidance: |
      High temperature detected for cycling activity. MediBuddy SOP-CYC-001 recommends:
      1. Cycle early morning or late evening to avoid peak heat
      2. Wear light-colored, breathable clothing
      3. Apply SPF 30+ sunscreen
      4. Drink water every 15-20 minutes
      5. Take breaks in shade every 30 minutes
      6. Consider postponing if temperature exceeds 40°C
    source: "WHO Heat Illness Prevention Guidelines"

  - id: "SOP-CYC-002"
    name: "Cycling in Poor Air Quality"
    category: "Cycling"
    applies_to:
      - "cycling"
      - "biking"
    severity: "high"
    priority: 95
    conditions:
      operator: "COMPOSITE_SCORE"
      scoring:
        base_score: 100.0
        penalties:
          - field: "air_quality_index"
            condition:
              operator: ">"
              threshold: 150
            penalty: 40.0
          - field: "air_quality_index"
            condition:
              operator: ">"
              threshold: 200
            penalty: 60.0
        decision_threshold:
          operator: ">"
          cutoff: 40.0
    guidance: |
      Poor air quality detected. MediBuddy SOP-CYC-002 recommends:
      1. Consider postponing outdoor cycling
      2. If cycling is necessary, wear N95 mask
      3. Reduce intensity and duration of activity
      4. Consult physician if you have respiratory conditions
      5. Monitor for symptoms: coughing, wheezing, shortness of breath
    source: "EPA Air Quality Guidelines"

  - id: "SOP-CYC-003"
    name: "Cycling in Cold with High Wind"
    category: "Cycling"
    applies_to:
      - "cycling"
      - "biking"
    severity: "moderate"
    priority: 85
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: "<"
          value: 5
          unit: "celsius"
        - field: "wind_speed"
          operator: ">="
          value: 25
          unit: "kmh"
        - field: "activity"
          operator: "=="
          value: "cycling"
    guidance: |
      Cold weather with high winds detected for cycling activity. MediBuddy SOP-CYC-003 recommends:
      1. Wear windproof outer layers to protect against wind chill
      2. Protect face and extremities with balaclava or face mask
      3. Wear waterproof gloves rated for cold
      4. Use bike lights and reflectors for visibility
      5. Reduce riding speed due to wind and reduced control
      6. Consider postponing if wind gusts exceed 40 kmh
    source: "Winter Cycling Safety Federation"

  # RUNNING CATEGORY (3 SOPs)
  - id: "SOP-RUN-001"
    name: "Running in Elevated Heat"
    category: "Running"
    applies_to:
      - "running"
      - "jogging"
    severity: "severe"
    priority: 110
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 35
          unit: "celsius"
        - field: "activity"
          operator: "=="
          value: "running"
    guidance: |
      Elevated heat conditions are a significant risk for running. MediBuddy SOP-RUN-001 recommends:
      1. Strongly consider postponing outdoor running
      2. If running, do so only during early morning or late evening
      3. Run slower and shorten the route
      4. Hydrate aggressively: 200-300ml water every 15 minutes
      5. Watch for heat exhaustion signs: dizziness, nausea, weakness
      6. Seek immediate medical attention if symptoms develop
    source: "American Heart Association Heat Safety"

  - id: "SOP-RUN-002"
    name: "Running with High Humidity"
    category: "Running"
    applies_to:
      - "running"
      - "jogging"
    severity: "moderate"
    priority: 75
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 25
          unit: "celsius"
        - field: "humidity"
          operator: ">"
          value: 80
          unit: "percent"
        - field: "activity"
          operator: "=="
          value: "running"
    guidance: |
      High humidity detected with warm temperature for running. MediBuddy SOP-RUN-002 recommends:
      1. Reduce running intensity and duration (body cannot cool effectively)
      2. Drink more water than normal: 250-300ml every 15 minutes
      3. Wear moisture-wicking clothing
      4. Run in shaded areas when possible
      5. Monitor body temperature and take frequent breaks
      6. Start slowly and listen to your body
    source: "Running USA Heat and Humidity Guidelines"

  - id: "SOP-RUN-003"
    name: "Running on Icy Conditions"
    category: "Running"
    applies_to:
      - "running"
      - "jogging"
    severity: "high"
    priority: 90
    conditions:
      operator: "COMPOSITE_SCORE"
      scoring:
        base_score: 100.0
        penalties:
          - field: "temperature"
            condition:
              operator: "<"
              threshold: 0
            penalty: 30.0
          - field: "precipitation"
            condition:
              operator: "=="
              value: "ice"
            penalty: 50.0
          - field: "temperature"
            condition:
              operator: "<"
              threshold: -5
            penalty: 20.0
        decision_threshold:
          operator: ">"
          cutoff: 30.0
    guidance: |
      Icy conditions detected for running activity. MediBuddy SOP-RUN-003 recommends:
      1. Wear shoes with good traction and ice cleats if available
      2. Reduce speed significantly to prevent slipping and falling
      3. Run on cleared paths or sidewalks when possible
      4. Shorten running distance and duration
      5. Run during daylight hours for better visibility
      6. Warm up thoroughly before running
      7. Consider running on a treadmill or indoor track instead
      8. Never run on black ice or suspicious patches
    source: "Winter Running Safety Association"

  # WALKING CATEGORY (1 SOP)
  - id: "SOP-WALK-001"
    name: "Walking in Moderate Heat"
    category: "Walking"
    applies_to:
      - "walking"
      - "hiking"
    severity: "moderate"
    priority: 70
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 28
          unit: "celsius"
        - field: "temperature"
          operator: "<"
          value: 35
          unit: "celsius"
        - field: "activity"
          operator: "=="
          value: "walking"
    guidance: |
      Moderate heat detected for walking activity. MediBuddy SOP-WALK-001 recommends:
      1. Walk during cooler parts of day (early morning or late evening)
      2. Choose shaded routes when possible
      3. Drink water regularly (150-200ml every 15-20 minutes)
      4. Wear sun protection: hat, sunglasses, light clothing
      5. Take 10-minute breaks in shade every 30-45 minutes
      6. Watch for signs of heat fatigue: dizziness, nausea
    source: "WHO Physical Activity Guidelines"

  # LEISURE / FAMILY OUTDOOR COVERAGE (2 SOPs)
  - id: "SOP-LEISURE-001"
    name: "Park Visit in Warm Weather for Children"
    category: "Leisure"
    applies_to:
      - "park_visit"
    severity: "moderate"
    priority: 80
    conditions:
      operator: "AND"
      rules:
        - field: "temperature"
          operator: ">="
          value: 24
          unit: "celsius"
        - field: "activity"
          operator: "=="
          value: "park_visit"
        - field: "user_group"
          operator: "=="
          value: "child"
    guidance: |
      Warm conditions are making a park visit less comfortable for children. MediBuddy SOP-LEISURE-001 recommends:
      1. Keep any park time short and stick to shaded areas
      2. Encourage frequent water breaks and a cool-down in shade
      3. Use hats, sunscreen, and lightweight clothing
      4. Consider moving the outing to a cooler part of the day
      5. Watch for overheating signs such as flushed skin, dizziness, or unusual tiredness
    source: "Pediatric Heat Safety Guidance"

  - id: "SOP-LEISURE-002"
    name: "Picnic in Severe Rain or Thunderstorm"
    category: "Leisure"
    applies_to:
      - "picnic"
    severity: "severe"
    priority: 120
    conditions:
      operator: "OR"
      rules:
        - field: "weather_condition"
          operator: "=="
          value: "thunderstorm"
        - field: "weather_condition"
          operator: "=="
          value: "severe_weather"
    guidance: |
      Severe weather is not suitable for a picnic. MediBuddy SOP-LEISURE-002 recommends:
      1. Postpone the picnic until the weather clears and lightning is no longer active
      2. Move the outing indoors or under a solid shelter
      3. Avoid open grass, open water, or elevated picnic spots during storms
      4. Keep drinks and food protected from heavy rain and strong winds
    source: "Outdoor Leisure Safety Guidance"

  # OUTDOOR EXERCISE GENERAL (4 SOPs)
  - id: "SOP-GEN-001"
    name: "Outdoor Exercise in Thunderstorm"
    category: "General Outdoor Exercise"
    applies_to:
      - "cycling"
      - "running"
      - "walking"
      - "jogging"
      - "hiking"
      - "park_visit"
      - "picnic"
      - "outdoor_photography"
    severity: "severe"
    priority: 120
    conditions:
      operator: "OR"
      rules:
        - field: "weather_condition"
          operator: "=="
          value: "thunderstorm"
        - field: "weather_condition"
          operator: "=="
          value: "severe_weather"
    guidance: |
      Active thunderstorm or severe weather detected. MediBuddy SOP-GEN-001 recommends:
      1. IMMEDIATELY STOP outdoor exercise and seek shelter
      2. Do not continue exercising outdoors during active lightning
      3. Move indoors to a safe building immediately
      4. Stay indoors until 30 minutes after last thunder
      5. Do not use mobile phones or electronics connected to power
      6. Avoid windows and open areas
      7. Wait for official all-clear from weather service
      8. Do not resume outdoor activities until thunderstorm passes
    source: "National Weather Service Lightning Safety"

  - id: "SOP-GEN-002"
    name: "Outdoor Exercise with Multiple Heat Risk Factors"
    category: "General Outdoor Exercise"
    applies_to:
      - "cycling"
      - "running"
      - "walking"
      - "jogging"
      - "hiking"
    severity: "high"
    priority: 105
    conditions:
      operator: "COMPOSITE_SCORE"
      scoring:
        base_score: 100.0
        penalties:
          - field: "temperature_2m"
            condition:
              operator: ">="
              threshold: 32
            penalty: 25.0
          - field: "temperature_2m"
            condition:
              operator: ">="
              threshold: 38
            penalty: 35.0
          - field: "precipitation_probability"
            condition:
              operator: ">"
              threshold: 70
            penalty: 20.0
        decision_threshold:
          operator: "<="
          cutoff: 55.0
    guidance: |
      Multiple heat risk factors detected for cycling, running, and other outdoor exercise. MediBuddy SOP-GEN-002 recommends:
      1. Reduce exercise intensity significantly (consider 50% normal effort)
      2. Shorten exercise duration (limit to 20-30 minutes max)
      3. Increase hydration: 300-400ml water every 15 minutes
      4. Exercise only during coolest hours (5-7 AM or 7-9 PM)
      5. Wear minimal, light-colored, loose clothing
      6. Take shade breaks every 15 minutes
      7. Have a companion with you at all times
      8. Consider postponing to a cooler day
      9. Watch for heat cramps, exhaustion, or stroke symptoms
      10. Call emergency services (911) if symptoms develop
    source: "CDC Extreme Heat and Outdoor Exercise"

  - id: "SOP-GEN-003"
    name: "Persistent Rain Advisory for Outdoor Activity"
    category: "General Outdoor Exercise"
    applies_to:
      - "cycling"
      - "running"
      - "walking"
      - "jogging"
      - "hiking"
      - "park_visit"
      - "picnic"
      - "outdoor_photography"
    severity: "moderate"
    priority: 98
    conditions:
      operator: "AND"
      rules:
        - field: "weather_condition"
          operator: "=="
          value: "rain"
        - field: "advisory_active"
          operator: "=="
          value: true
        - field: "advisory_category"
          operator: "=="
          value: "rain"
        - field: "advisory_type"
          operator: "=="
          value: "persistent_rain_advisory"
    guidance: |
      Persistent rain advisory detected. MediBuddy SOP-GEN-003 recommends:
      1. Reduce intensity and keep outdoor exercise brief
      2. Choose routes with better drainage and avoid flooded areas
      3. Wear water-resistant gear and maintain good visibility
      4. Increase hydration awareness even while exercising in rain
      5. Stop if footing becomes unsafe or lightning is nearby
    source: "National Weather Service Rain Safety"

  - id: "SOP-GEN-004"
    name: "Severe Low-Pressure or Cyclonic Weather System"
    category: "General Outdoor Exercise"
    applies_to:
      - "cycling"
      - "running"
      - "walking"
      - "jogging"
      - "hiking"
      - "park_visit"
      - "picnic"
      - "outdoor_photography"
    severity: "severe"
    priority: 130
    conditions:
      operator: "AND"
      rules:
        - field: "advisory_active"
          operator: "=="
          value: true
        - field: "advisory_type"
          operator: "=="
          value: "low_pressure_or_cyclonic_system"
        - field: "rainfall_intensity"
          operator: "=="
          value: "heavy_to_very_heavy"
    guidance: |
      Severe low-pressure or cyclonic weather system is active with heavy to very heavy rainfall. MediBuddy SOP-GEN-004 recommends:
      1. IMMEDIATELY avoid all outdoor exercise
      2. Seek shelter in a safe indoor location without delay
      3. Postpone cycling, running, walking, jogging, and hiking until the advisory is lifted
      4. Avoid waterlogged roads, drainage channels, and exposed open spaces
      5. Monitor official weather updates and wait for clear conditions before resuming outside activity
    source: "Authoritative Severe Weather Advisory"
